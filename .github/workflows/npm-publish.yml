name: npm-publish
on:
  push:
    branches:
      - main

# Only one publish at a time; never cancel a running publish halfway.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm-publish:
    name: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the release tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # The package is built from source here - nothing that was committed
      # pre-built gets published, and nothing is published if tests fail.
      - name: Install, build and test
        run: |
          npm ci
          npm test

      - name: Publish to NPM
        id: publish
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          token: ${{ secrets.NPM_AUTH_TOKEN }}
          strategy: upgrade

      - name: Create Git Tag
        if: steps.publish.outputs.type != 'none'
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
        env:
          VERSION: ${{ steps.publish.outputs.version }}
